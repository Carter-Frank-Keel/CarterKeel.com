<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secrets - Carter Keel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .classified-header {
      color: #ff3333;
      font-family: monospace;
      text-align: center;
      font-size: calc(4rem * var(--ui-scale));
      border-bottom: 2px dashed #ff3333;
      margin-bottom: calc(3rem * var(--ui-scale));
      padding-bottom: calc(1rem * var(--ui-scale));
      letter-spacing: 0.3rem;
      text-transform: uppercase;
    }
    .secret-content-box {
      font-family: monospace;
      background-color: #050505;
      color: #00ffcc;
      padding: calc(4rem * var(--ui-scale));
      border: 2px solid #333;
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.1);
      width: 100%;
      min-height: 50vh;
      line-height: 1.6;
      font-size: calc(2.5rem * var(--ui-scale));
    }
    .secret-content-box p {
      margin-bottom: 1.5rem;
    }
    .terminal-input {
      background: transparent;
      border: none;
      border-bottom: 2px solid #00ffcc;
      color: #00ffcc;
      font-family: monospace;
      font-size: calc(2.5rem * var(--ui-scale));
      outline: none;
      padding: 0.2rem 0.5rem;
      width: 300px;
    }
    .emergency-exit-btn {
      background-color: #220000;
      color: #ff3333;
      border: 2px solid #ff3333;
      font-family: monospace;
      font-weight: bold;
      padding: 0.6rem 1.5rem;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 2rem;
    }
    .emergency-exit-btn:hover {
      background-color: #ff3333;
      color: #000000;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn title-btn">Carter Keel</a>
    <nav id="main-nav">
      <a href="who-i-am.html" class="btn">Who I am</a>
      <a href="job-history.html" class="btn">Job History</a>
      <a href="blog.html" class="btn">Blog</a>
      <a href="my-writings.html" class="btn">My Writings</a>
      <a href="contact.html" class="btn">Contact Me</a>
      <a href="settings.html" class="btn icon-btn" id="settings-nav-btn">
        <img src="Image_Resources/settings_icon.png" alt="Settings">
      </a>
    </nav>
  </header>

  <main id="secret-main">
    <div class="hero-container" style="display: flex; justify-content: center; grid-template-columns: 1fr;">
      
      <div class="secret-content-box">
        <h1 class="classified-header">TOP SECRET // CLASSIFIED</h1>
        
        <div id="prompt-section">
          <p>> AUTHORIZATION REQUIRED.</p>
          <p>> Please enter your name: <input type="text" id="name-input" class="terminal-input" autofocus autocomplete="off"> <button id="submit-name-btn" class="btn" style="color: #00ffcc; border: 1px solid #00ffcc; margin-left: 10px;">Enter</button></p>
          <p id="terminal-error" style="color: red; display: none; margin-top: 1rem;"></p>
        </div>

        <div id="unlocked-content" style="display: none;">
          <p id="welcome-message"></p>
          <p id="roast-message" style="color: #ff3333; font-weight: bold; display: none;"></p>
          <p id="special-message" style="color: #00ffcc; font-weight: bold; display: none;"></p>
          
          <div id="decrypted-payload"></div>
          
          <div style="margin-top: 3rem; border-top: 1px dashed #333; padding-top: 1.5rem;">
            <button id="emergency-exit-btn" class="emergency-exit-btn">> EMERGENCY EXIT (LOCKDOWN & EXIT)</button>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script>
    if (localStorage.getItem('secretsUnlocked') !== 'true') {
      document.getElementById('secret-main').innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 65vh; color: red; font-family: monospace; text-align: center;">
          <h1 style="font-size: calc(10rem * var(--ui-scale)); margin-bottom: 1rem;">ACCESS DENIED</h1>
          <p style="font-size: calc(3rem * var(--ui-scale));">Unauthorized breach detected. Rerouting...</p>
        </div>
      `;
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 3000);
    } else {
      if (!sessionStorage.getItem('sessionStartTime')) {
        sessionStorage.setItem('sessionStartTime', Date.now());
      }

      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const savedAccent = localStorage.getItem('accent-color') || '#333333';
      document.documentElement.style.setProperty('--accent-color', savedAccent);
      const savedFont = localStorage.getItem('font-style') || 'sans-serif';
      document.documentElement.style.setProperty('--font-family', savedFont);

      if (localStorage.getItem('dyslexia-mode') === 'true') {
        document.documentElement.classList.add('dyslexia-font');
      }
      if (localStorage.getItem('hacker-mode') === 'true') {
        document.documentElement.classList.add('hacker-mode');
      }
      const savedScale = localStorage.getItem('ui-scale') || '50';
      document.documentElement.style.setProperty('--ui-scale', savedScale / 100);

      const nameInput = document.getElementById('name-input');
      const submitBtn = document.getElementById('submit-name-btn');
      const promptSection = document.getElementById('prompt-section');
      const unlockedContent = document.getElementById('unlocked-content');
      const welcomeMessage = document.getElementById('welcome-message');
      const roastMessage = document.getElementById('roast-message');
      const specialMessage = document.getElementById('special-message');
      const terminalError = document.getElementById('terminal-error');
      const emergencyExitBtn = document.getElementById('emergency-exit-btn');
      const decryptedPayload = document.getElementById('decrypted-payload');

      const allowedNames = ["zaden", "captain america", "giraffe", "barbie"];

      // Updated Base64 payload with the placeholder text removed (leaving only system status, clearance level, description, and Sadie)
      const encodedSecretHTML = "PHA+PiBTWVNURU0gU1RBVFVTOiBPTkxJTkU8L3A+CjxwPj4gQ0xFQVJBTkNFTCBMRVZFTDogTUFYSU1VTTwvcD5KPGJyPgo8cEE+VGhpcyBzcGFjZSBpcyB1bmxvY2tlZCBvbmx5IGZvciB0aG9zZSB3aXRoIHRoZSBjb3JyZWN0IGF1dGhvcml6YXRpb24gY29kZS4gWW91IGNhbiB1c2UgdGhpcyBhcmVhIHRvIHN0b3JlIHBlcnNvbmFsIG5vdGVzLCBoaWRkZW4gbGlua3MsIHByaXZhdGUgcHJvamVjdHMsIG9yIHRoaW5ncyBvbmx5IGEgc2VsZWN0IGZldyBzaG91bGQgc2VlLjwvcD4KPGJyPgo8cCBzdHlsZT0iY29sb3I6ICNmZjMzMzM7IGZvbnQtd2VpZ2h0OiBib2xkOyI+U0VDUkVUIE1FU1NBR0U6IFNhZGllPC9wPg==";

      function handleNameSubmission() {
        const rawName = nameInput.value;
        const normalizedName = rawName.toLowerCase().replace(/\s+/g, ' ').trim();

        if (normalizedName !== '') {
          if (!allowedNames.includes(normalizedName)) {
            terminalError.textContent = `> ACCESS DENIED: Unrecognized clearance identity. Purging session...`;
            terminalError.style.display = 'block';
            localStorage.removeItem('secretsUnlocked');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 3000);
          } else {
            welcomeMessage.textContent = `> Welcome to the hidden terminal, ${rawName.trim()}.`;
            
            if (normalizedName === "zaden") {
              roastMessage.textContent = `> Warning: Poopy face detected in system database.`;
              roastMessage.style.display = 'block';
            }

            if (normalizedName === "captain america") {
              specialMessage.textContent = `> Welcome home master.`;
              specialMessage.style.display = 'block';
            }

            try {
              decryptedPayload.innerHTML = atob(encodedSecretHTML);
            } catch (e) {
              decryptedPayload.innerHTML = "<p>Error loading secure payload.</p>";
            }

            promptSection.style.display = 'none';
            unlockedContent.style.display = 'block';
          }
        }
      }

      submitBtn.addEventListener('click', handleNameSubmission);
      nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          handleNameSubmission();
        }
      });

      emergencyExitBtn.addEventListener('click', () => {
        localStorage.removeItem('secretsUnlocked');
        window.location.href = 'index.html';
      });
    }
  </script>
</body>
</html>
