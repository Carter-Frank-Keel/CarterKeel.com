<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me - Carter Keel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="btn title-btn">Carter Keel</a>
    <nav id="main-nav">
      <a href="who-i-am.html" class="btn">Who I am</a>
      <a href="job-history.html" class="btn">Job History</a>
      <a href="blog.html" class="btn">Blog</a>
      <a href="my-writings.html" class="btn">My Writings</a>
      <a href="contact.html" class="btn">Contact Me</a>
      <a href="settings.html" class="btn icon-btn" id="settings-nav-btn">
        <img src="Image_Resources/settings_icon.png" alt="Settings">
      </a>
    </nav>
  </header>

  <main>
    <div class="hero-container contact-layout">
      <div class="contact-buttons-container">
        <button id="email-btn" class="contact-pill-btn email-logo-btn" onclick="copyEmail()">
          <img src="Image_Resources/outlook_logo.png" alt="Outlook Logo" class="contact-logo">
          carterkeel@hotmail.com
        </button>
        <a href="https://linkedin.com" target="_blank" class="contact-pill-btn">linkedin</a>
        <a href="https://instagram.com" target="_blank" class="contact-pill-btn">instagram</a>
        <a href="https://myspace.com" target="_blank" class="contact-pill-btn">myspace</a>
      </div>
    </div>
  </main>

  <script>
    // Global Session Timer Initialization
    if (!sessionStorage.getItem('sessionStartTime')) {
      sessionStorage.setItem('sessionStartTime', Date.now());
    }

    // Apply saved settings globally
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    const savedAccent = localStorage.getItem('accent-color') || '#333333';
    document.documentElement.style.setProperty('--accent-color', savedAccent);

    const savedFont = localStorage.getItem('font-style') || 'sans-serif';
    document.documentElement.style.setProperty('--font-family', savedFont);

    if (localStorage.getItem('dyslexia-mode') === 'true') {
      document.documentElement.classList.add('dyslexia-font');
    }

    if (localStorage.getItem('hacker-mode') === 'true') {
      document.documentElement.classList.add('hacker-mode');
    }

    if (localStorage.getItem('invert-gravity') === 'true') {
      document.documentElement.classList.add('invert-gravity');
    }

    const savedCursor = localStorage.getItem('cursor-style') || 'default';
    if (savedCursor === 'dot') document.documentElement.classList.add('cursor-pointer-dot');
    if (savedCursor === 'crosshair') document.documentElement.classList.add('cursor-crosshair');
    if (savedCursor === 'pencil') document.documentElement.classList.add('cursor-pencil');

    const savedScale = localStorage.getItem('ui-scale') || '50';
    document.documentElement.style.setProperty('--ui-scale', savedScale / 100);

    // Mouse Trail Animation Loop Globally
    window.addEventListener('mousemove', (e) => {
      if (localStorage.getItem('mouse-trail') === 'true') {
        const dot = document.createElement('div');
        dot.className = 'mouse-trail-dot';
        dot.style.left = `${e.clientX}px`;
        dot.style.top = `${e.clientY}px`;
        document.body.appendChild(dot);

        setTimeout(() => {
          dot.style.opacity = '0';
          dot.style.transform = 'translate(-50%, -50%) scale(0.2)';
        }, 20);

        setTimeout(() => {
          dot.remove();
        }, 400);
      }
    });

    // Email Copy Functionality
    function copyEmail() {
      const email = "carterkeel@hotmail.com";
      navigator.clipboard.writeText(email).then(() => {
        const btn = document.getElementById('email-btn');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = "Copied to Clipboard!";
        setTimeout(() => {
          btn.innerHTML = originalHTML;
        }, 2000);
      });
    }

    // SECRETS UNLOCK CHECKER
    if (localStorage.getItem('secretsUnlocked') === 'true') {
      const nav = document.getElementById('main-nav');
      const settingsBtn = document.getElementById('settings-nav-btn');
      const secretLink = document.createElement('a');
      secretLink.href = 'secrets.html';
      secretLink.className = 'btn';
      secretLink.textContent = 'Secrets';
      secretLink.style.color = 'var(--text-color)';
      secretLink.style.fontWeight = 'bold';
      nav.insertBefore(secretLink, settingsBtn);
    }

    // Auto-highlight active page in nav
    const currentPage = window.location.pathname.split("/").pop() || "index.html";
    document.querySelectorAll("nav a").forEach(link => {
      if (link.getAttribute("href") === currentPage) {
        link.classList.add("active");
      }
    });

  </script>

</body>
</html>
